name: Verify Guide & Source Repos

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  backend:
    name: 后端可编译（JDK 21）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wcyddaa/xs-platform
          path: xs-platform
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven package
        working-directory: xs-platform
        run: mvn -B -Dmaven.test.skip=true package
      - name: 校验 8 个服务 jar
        run: |
          for m in xs-user xs-auth xs-course xs-book xs-exam xs-data xs-config xs-learning; do
            test -f "xs-platform/$m/target/$m-1.0.0.jar" || (echo "缺少 $m jar" && exit 1)
          done

  frontend:
    name: 前端可构建（Node 22）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wcyddaa/ai-assistant
          path: ai-assistant
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖
        working-directory: ai-assistant
        run: npm install --no-audit --no-fund
      - name: 构建 H5
        working-directory: ai-assistant
        run: npm run build:h5

  python:
    name: 智能体服务可编译（Python 3.13 / uv）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wcyddaa/fastapi-ai-assistant
          path: fastapi-ai-assistant
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 安装 uv 并同步依赖
        working-directory: fastapi-ai-assistant
        run: |
          pip install uv
          uv sync --python python3.13
      - name: 语法编译检查
        working-directory: fastapi-ai-assistant
        run: uv run python -m compileall -q -x '(.venv|__pycache__|exports)' .

  guide:
    name: 指引仓库完整性（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell 语法检查
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "语法错误：$($_.Name)" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host "  $($_.Message)" }
            } else {
              Write-Host "OK: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
      - name: 校验种子数据与索引文件
        shell: powershell
        run: |
          $errors = @()
          if (-not (Test-Path 'sql\seed.sql')) { $errors += '缺少 sql\seed.sql' }
          $dbCount = (Select-String -Path 'sql\seed.sql' -Pattern 'CREATE DATABASE' | Measure-Object).Count
          if ($dbCount -ne 6) { $errors += "seed.sql 数据库数量为 $dbCount，期望 6" }
          if (-not (Select-String -Path 'sql\seed.sql' -Pattern 'admin001' -Quiet)) { $errors += 'seed.sql 缺少 admin001' }
          foreach ($name in @('textbook_index','courseware_index','textbook_chunk_vector','courseware_chunk_vector')) {
            if (-not (Test-Path "es\$name-meta.json")) { $errors += "缺少 es\$name-meta.json" }
            if (-not (Test-Path "es\$name-data.ndjson.gz")) { $errors += "缺少 es\$name-data.ndjson.gz" }
          }
          if (-not (Test-Path 'runtime\Redis-x64-3.0.504.zip')) { $errors += '缺少内置 Redis 压缩包' }
          if (-not (Test-Path 'config\app.env.example')) { $errors += '缺少 config\app.env.example' }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host "FAIL: $_" -ForegroundColor Red }
            exit 1
          }
          Write-Host '种子数据与索引文件完整'
      - name: 校验 ES 压缩数据可解压
        shell: powershell
        run: |
          foreach ($f in Get-ChildItem 'es\*-data.ndjson.gz') {
            $fs = [System.IO.File]::OpenRead($f.FullName)
            try {
              $gz = New-Object System.IO.Compression.GZipStream($fs, [System.IO.Compression.CompressionMode]::Decompress)
              $buf = New-Object byte[] 4096
              $read = $gz.Read($buf, 0, $buf.Length)
              if ($read -le 0) { throw "无法读取 $($f.Name)" }
              $gz.Dispose()
              Write-Host "OK: $($f.Name)"
            } finally { $fs.Dispose() }
          }
      - name: 执行环境自检脚本
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\00-check-env.ps1

  secret-scan:
    name: 三个源码仓库密钥扫描
    runs-on: ubuntu-latest
    steps:
      - name: Clone public repos
        run: |
          for repo in xs-platform ai-assistant fastapi-ai-assistant; do
            git clone --depth 1 "https://github.com/wcyddaa/$repo.git" "$repo"
          done
      - name: 扫描真实密钥
        run: |
          set -e
          if grep -rInE --exclude-dir=.git --exclude-dir=target --exclude-dir=node_modules \
              --exclude-dir=.venv --exclude-dir=dist --exclude-dir=__pycache__ --exclude-dir=unpackage \
              'sk-[A-Za-z0-9]{20,}' . ; then
            echo "发现疑似真实 API Key，请立即脱敏"
            exit 1
          else
            echo "未发现 sk- 形式的真实 Key"
          fi
